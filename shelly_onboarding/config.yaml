name: Shelly Onboarding
version: 0.1.5
slug: shelly_onboarding
description: Neue Shelly WLAN-Plugs erkennen und per Vorlage in HA MQTT aufnehmen
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:power-plug
hassio_api: true
hassio_role: admin
homeassistant_api: true
options:
  wifi_interface: wlan0
  scan_interval: 90
  ssid: ""
  wifi_password: ""
  broker: ""
  mqtt_user: ""
  mqtt_password: ""
  tls: user_ca.pem
  ca_pem: ""
  shelly_admin_password: ""
  discovery_prefix: homeassistant
schema:
  wifi_interface: str
  scan_interval: int(30,3600)
  ssid: str
  wifi_password: password
  broker: str
  mqtt_user: str
  mqtt_password: password
  tls: list(user_ca.pem|ca.pem|off)
  ca_pem: str
  shelly_admin_password: password
  discovery_prefix: str
