<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shelly Onboarding</title>
<style>[hidden]{display:none!important}
:root{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif;--line:#8999a250;--accent:#007277}body{margin:0;background:Canvas;color:CanvasText}main{max-width:48rem;margin:auto;padding:1.4rem}h1{font-size:2rem;letter-spacing:-.04em}h2{font-size:1.22rem}section,details{border-top:1px solid var(--line);padding:.7rem 0 1rem}input,select,button{font:inherit;border-radius:.5rem;padding:.55rem;border:1px solid var(--line);box-sizing:border-box}label{display:grid;gap:.25rem;margin:.6rem 0}button{margin:.25rem .4rem .25rem 0;cursor:pointer}button.primary{background:var(--accent);color:white}button:disabled{opacity:.5}small{opacity:.8}#msg{color:#b24d19;white-space:pre-wrap}article{border-left:3px solid var(--accent);padding:.5rem .9rem;margin:.8rem 0}summary{cursor:pointer}fieldset{border:0;margin:0;padding:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.2rem 1rem}p{overflow-wrap:anywhere}
</style><main><h1>Shelly Onboarding</h1><p id="msg" role="alert"></p>
<section><h2>Neue Plugs</h2><div id="aps"></div><button id="scan">WLAN durchsuchen</button><button id="manual">Über Ziel-IP einrichten</button><div id="ignored"></div><small id="notice"></small></section>
<section id="wizard" hidden><h2 id="heading"></h2><form id="form">
<div id="manualFields" class="grid"><label>Ziel-IP<input name="ip" placeholder="192.168.…"></label><label>MAC laut Gerät<input name="expected" placeholder="12 Hex-Zeichen"></label></div>
<label>Vorlage<select id="src"></select></label><div id="templateBox" hidden><label>IP der Vorlage<input id="srcIp"></label><button type="button" id="load">Gerätekonfiguration lesen</button></div>
<div class="grid"><label>Neuer Gerätename<input name="name" required></label><label>Bereich<select name="area"></select></label></div>
<label>MQTT-Topic-Basis<input name="base" required placeholder="shellies/EG/Kueche/Weihnachtsstern"></label>
<div class="grid"><label>Ziel-SSID<input name="ssid" required></label><label>MQTT-Broker<input name="broker" required placeholder="mqtt.example:8883" aria-describedby="brokerPorts"><small id="brokerPorts">Standardports für MQTT: 1883 ohne Verschlüsselung, 8883 mit Verschlüsselung (TLS).</small></label><label>MQTT-Benutzer<input name="user"></label><label>TLS<select name="tls"><option>user_ca.pem</option><option>ca.pem</option><option>off</option></select></label><label>Nach Stromausfall<select name="initial_state"><option value="off">Aus</option><option value="on">Ein</option><option value="restore_last">Letzten Zustand herstellen</option></select></label></div>
<label><span><input type="checkbox" id="suffix" checked> MAC für ein eindeutiges Topic anhängen</span></label><small id="origin"></small><p id="preview"></p><button class="primary">Einstellungen bestätigen und einrichten</button></form></section>
<section><h2>Einrichtungen</h2><div id="jobs"></div></section>
<section id="finish" hidden><h2 id="finishTitle"></h2><label>Label für den neuen Schalter<select id="labels"></select></label><button id="addLabel">Label zuweisen</button><label>Bestehenden Schalter als Vorbild auswählen<select id="old"></select></label><button id="inspect">Automationen und Skripte prüfen</button><div id="effects"></div></section><div id="undos"></div></main>
<script>
const $=id=>document.getElementById(id), form=$('form'), fields=form.elements;
let state, inv, ap='', selected='', sourceRead='', loading=false;
const prompted=new Set();
function element(tag,text){const n=document.createElement(tag); n.textContent=text;return n}
function button(text,fn){const b=element('button',text);b.type='button';b.onclick=guard(fn);return b}
function guard(fn){return async e=>{e?.preventDefault();$('msg').textContent='';try{await fn()}catch(err){$('msg').textContent=err.message;window.scrollTo(0,0)}}}
async function api(key,body={}){const res=await fetch('api/'+key,{method:'POST',headers:{'Content-Type':'application/json','X-Onboarding':'1'},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw Error(data.error||res.statusText);return data}
function options(sel,rows){sel.replaceChildren(...rows.map(([val,name])=>new Option(name,val)))}
function source(){return inv.sources.find(s=>s.id===$('src').value)}
function mac(){return (ap?ap.split('-').pop():fields.expected.value).replace(/[:-]/g,'').toLowerCase()}
function preview(){ $('preview').textContent='Vollständiges Topic: '+fields.base.value+($('suffix').checked?'-'+(mac()||'MAC'):'') }
function defaults(){let p=state.profile;Object.assign(fields.ssid,{value:p.ssid});fields.user.value=p.mqtt_user;fields.broker.value=p.broker;fields.tls.value=p.tls;fields.initial_state.value='off';fields.area.value='';sourceRead='';$('origin').textContent='WLAN, Broker und Zugang aus dem lokalen App-Profil. Zugangsdaten in der App-Konfiguration ändern.'}
async function openForm(ssid,clone){inv=await api('inventory');ap=ssid;form.reset();$('wizard').hidden=false;$('heading').textContent=ssid||'Plug im Zielnetz';$('manualFields').hidden=!!ssid;
options($('src'),[['','Ohne Vorlage'],...inv.sources.map(s=>[s.id,s.name+' · '+(s.model||'Shelly')])]);options(fields.area,[['','Kein Bereich'],...inv.areas.map(a=>[a.area_id,a.name])]);defaults();$('templateBox').hidden=true;
if(clone){if(!inv.sources.length)throw Error('Keine Shelly-Vorlagen in HA gefunden.');$('src').selectedIndex=1;sourceChange()}
preview();$('wizard').scrollIntoView()}
function sourceChange(){defaults();const s=source();$('templateBox').hidden=!s;$('srcIp').value=s?.ip||''}
$('src').onchange=sourceChange;
$('load').onclick=guard(async()=>{const s=source();const p=await api('template',{source:s.id,ip:$('srcIp').value});for(const k of ['ssid','broker','user','tls','initial_state','area'])fields[k].value=p[k]||'';
fields.base.value=(p.source_topic||'shellies').split('/').slice(0,-1).concat(['neuer-plug']).join('/');sourceRead=s.id;preview();$('origin').textContent='WLAN, MQTT und Einschaltverhalten aus '+s.name+' gelesen. Passwörter und CA kommen aus dem lokalen Profil.'});
$('suffix').onchange=preview;fields.base.oninput=fields.expected.oninput=preview;
form.onsubmit=guard(async()=>{if(source()&&sourceRead!==source().id)throw Error('Vorlage zuerst lesen.');const data=Object.fromEntries(new FormData(form));data.ap=ap;data.expected=mac();data.topic=data.base+($('suffix').checked?'-'+mac():'');data.source=$('src').value;data.source_ip=$('srcIp').value;await api('start',data);sessionStorage.setItem('started',data.expected);$('wizard').hidden=true;await refresh()});
async function finish(j){inv=await api('inventory');selected=j.mac;$('finish').hidden=false;$('finishTitle').textContent=j.plan.name+' in Automationen aufnehmen';options($('labels'), inv.labels.map(l=>[l.label_id,l.name]));const christmas=inv.labels.find(l=>l.name.toLowerCase()==='weihnachten');if(christmas)$('labels').value=christmas.label_id;
options($('old'),inv.sources.flatMap(s=>s.switches.filter(e=>e!==j.entity).map(e=>[e,s.name+' · '+e])));$('effects').replaceChildren();$('finish').scrollIntoView()}
$('addLabel').onclick=guard(async()=>{if(!$('labels').value)throw Error('Zuerst ein Label in HA anlegen.');await api('label',{mac:selected,label:$('labels').value});$('effects').textContent='Label zugewiesen.'});
async function inspect(){
    const mac=selected, old=$('old').value;
    if(!old)throw Error('Referenzschalter auswählen.');
    const out=await api('effects',{mac,old});
    if(selected!==mac||$('old').value!==old)return;
    const box=$('effects');
    box.replaceChildren(element('p',out.refs.length+' Treffer. '+out.skipped.length+' Konfigurationen konnten nicht gelesen werden.'));
    const applicable=out.refs.filter(ref=>ref.changes.length);
    const apply=async refs=>{
        const controls=[...box.querySelectorAll('button'),$('inspect'),$('old')];
        controls.forEach(control=>control.disabled=true);
        try{
            const apply_all=Object.fromEntries(refs.map(ref=>[ref.path,ref.digest]));
            const result=await api('effects',{mac,old,apply_all});
            await refresh();
            if(selected===mac&&$('old').value===old){
                await inspect();
                box.prepend(element('p',result.saved.length+' von '+refs.length+' Änderungen übernommen.'));
                for(const failure of result.failed){
                    box.prepend(element('p',failure.name+': '+failure.error));
                }
            }
        }finally{
            controls.forEach(control=>control.disabled=false);
        }
    };
    if(applicable.length){
        const all=button('Alle '+applicable.length+' Änderungen übernehmen',()=>apply(applicable));
        all.className='primary';
        box.append(all);
    }
    for(const ref of out.refs){
        const row=element('article',ref.name);
        if(ref.changes.length){
            row.append(element('p','Ergänze '+state.jobs[mac].entity+' neben '+old+' in '+ref.changes.join(', ')));
            row.append(button('Diese Änderung übernehmen',()=>apply([ref])));
        }else{
            row.append(element('p','Bezug manuell prüfen.'));
        }
        box.append(row);
    }
    if(out.skipped.length){
        const details=element('details','');
        details.append(element('summary','Übersprungene Einträge'),element('p',out.skipped.join(', ')));
        box.append(details);
    }
}
$('old').onchange=()=>$('effects').replaceChildren();
$('inspect').onclick=guard(inspect);$('manual').onclick=guard(()=>openForm('',false));$('scan').onclick=guard(async()=>{await api('scan');await refresh()});
async function refresh(){if(loading)return;loading=true;try{state=await api('state');$('notice').textContent=state.notice;$('aps').replaceChildren();for(const ssid of state.aps){const row=element('article','');row.append(element('strong',ssid),element('br',''),button('Neu einrichten',()=>openForm(ssid,false)),button('Nach Vorlage',()=>openForm(ssid,true)),button('Ignorieren',async()=>{await api('ignore',{ap:ssid});await refresh()}));$('aps').append(row)}if(!state.aps.length)$('aps').textContent='Aktuell kein neuer Shelly in Funkreichweite.';
$('ignored').replaceChildren(...state.ignored.map(ap=>button(ap+' wieder anzeigen',async()=>{await api('ignore',{ap});await refresh()})));
$('jobs').replaceChildren();for(const j of Object.values(state.jobs).reverse()){if(j.step==='Fertig'&&!prompted.has(j.mac)){prompted.add(j.mac);if(sessionStorage.getItem('started')===j.mac){sessionStorage.removeItem('started');await finish(j)}}const row=element('article','');row.append(element('strong',j.plan.name),element('p',[j.step,j.ip,j.entity,j.error].filter(Boolean).join(' · ')));if(j.step==='Fertig')row.append(button('Label und Automationen …',()=>finish(j)));else if(!state.busy)row.append(button('Fortsetzen',async()=>{const ip=prompt('Optional neue Ziel-IP eingeben. Leer = gespeicherten Schritt wiederholen.',j.ip||'');if(ip!==null){await api('resume',{mac:j.mac,ip});await refresh()}}),button('Vorgang verwerfen',async()=>{if(confirm('Lokalen Vorgang verwerfen? Bereits geschriebene Geräteeinstellungen bleiben aktiv.')){await api('discard',{mac:j.mac});await refresh()}}));$('jobs').append(row)}
$('undos').replaceChildren(...state.backups.map(key=>button('Änderung zurücknehmen · '+key.split(':').pop(),async()=>{await api('undo',{key});await refresh()})))}finally{loading=false}}
guard(refresh)();setInterval(guard(refresh),5000);
</script></html>
