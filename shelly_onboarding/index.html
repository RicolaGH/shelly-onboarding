<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shelly Onboarding</title>
<style>
[hidden]{display:none!important}
:root{
    color-scheme:light dark;
    font:15px/1.5 system-ui,sans-serif;
    --bg:#f4f6f7;--surface:#fff;--text:#19282c;--muted:#52666b;
    --line:#dce4e6;--accent:#006c70;--soft:#e9f4f3;--warning:#93470b;
}
@media(prefers-color-scheme:dark){
    :root{--bg:#151c1e;--surface:#1d282b;--text:#eef4f3;--muted:#b2c3c5;
          --line:#38484c;--accent:#80d5cc;--soft:#253e3d;--warning:#ffbe80}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
main{max-width:58rem;margin:auto;padding:clamp(.75rem,3vw,2rem)}
h1{font-size:clamp(1.6rem,5vw,2rem);letter-spacing:-.035em;margin:0 0 1.2rem}
h2{font-size:1.15rem;margin:0 0 .75rem}
p{margin:.35rem 0 .65rem;overflow-wrap:anywhere}
section{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin-bottom:1rem;min-width:0}
input,select,button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:.55rem;padding:.48rem .7rem;min-width:0;max-width:100%}
button{margin:.2rem .35rem .2rem 0;cursor:pointer;min-height:2.4rem}
button:hover:not(:disabled){background:var(--soft)}
button.primary{background:#006c70;border-color:#006c70;color:#fff}
button.primary:hover:not(:disabled){background:#00565a}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:grid;gap:.25rem;margin:.5rem 0}
small,.muted,.job-meta{color:var(--muted)}
#msg{color:var(--warning);white-space:pre-wrap}
#msg:empty,#active:empty{display:none}
.warning{color:var(--warning)}
article{border-bottom:1px solid var(--line);padding:.65rem 0;overflow-wrap:anywhere}
article:last-child{border-bottom:0}
summary{cursor:pointer;overflow-wrap:anywhere}
details>ul{margin:.4rem 0;padding-inline-start:1.4rem;overflow-wrap:anywhere}
fieldset{border:0;margin:0;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:.25rem 1rem;align-items:start}
.history-tools,.finish-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.history-tools h2,.finish-header h2{margin:0}
.history-tools input{width:min(100%,18rem)}
.job-list{margin-top:.65rem}
.job-row{border-bottom:1px solid var(--line)}
.job-row:last-child{border-bottom:0}
.job-row>summary{padding:.75rem .25rem}
.job-row>summary:hover{background:var(--soft)}
.job-row>summary strong{margin-inline-start:.3rem}
.job-body{padding:0 .35rem .8rem 1.25rem}
.job-body details,.effect-details{margin:.45rem 0}
.job-meta{display:block;font-size:.88rem;overflow-wrap:anywhere}
.undo-list{list-style:none;padding:0}
.undo-list li{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.25rem .6rem}
.undo-list button{flex:none}
code{font-size:.86em;overflow-wrap:anywhere}
</style><main><h1>Shelly Onboarding</h1><p id="msg" role="alert"></p>
<section><h2>Neue Plugs</h2><div id="aps"></div><button id="scan">WLAN durchsuchen</button><button id="manual">Über Ziel-IP einrichten</button><div id="ignored"></div><small id="notice"></small></section>
<section id="wizard" hidden><h2 id="heading"></h2><form id="form">
<div id="manualFields" class="grid"><label>Ziel-IP<input name="ip" placeholder="192.168.…"></label><label>MAC laut Gerät<input name="expected" placeholder="12 Hex-Zeichen"></label></div>
<label>Vorlage<select id="src"></select></label><div id="templateBox" hidden><label>IP der Vorlage<input id="srcIp"></label><button type="button" id="load">Gerätekonfiguration lesen</button></div>
<div class="grid"><label>Neuer Gerätename<input name="name" required></label><label>Bereich<select name="area"></select></label></div>
<label>MQTT-Topic-Basis<input name="base" required placeholder="shellies/EG/Kueche/Weihnachtsstern"></label>
<div class="grid"><label>Ziel-SSID<input name="ssid" required></label><label>MQTT-Broker<input name="broker" required placeholder="mqtt.example:8883" aria-describedby="brokerPorts"><small id="brokerPorts">Standardports für MQTT: 1883 ohne Verschlüsselung, 8883 mit Verschlüsselung (TLS).</small></label><label>MQTT-Benutzer<input name="user"></label><label>TLS<select name="tls"><option>user_ca.pem</option><option>ca.pem</option><option>off</option></select></label><label>Nach Stromausfall<select name="initial_state"><option value="off">Aus</option><option value="on">Ein</option><option value="restore_last">Letzten Zustand herstellen</option></select></label></div>
<label><span><input type="checkbox" id="suffix" checked> MAC für ein eindeutiges Topic anhängen</span></label><small id="origin"></small><div id="templateSummary"></div><p id="preview"></p><button class="primary">Einstellungen bestätigen und einrichten</button></form></section>
<section id="active" aria-label="Offene Einrichtungen"></section>
<section id="finish" hidden><div class="finish-header"><h2 id="finishTitle"></h2><button id="closeFinish">Schließen</button></div><label>Label für den neuen Schalter<select id="labels"></select></label><button id="addLabel">Label zuweisen</button><label>Bestehenden Schalter als Vorbild auswählen<select id="old"></select></label><button id="inspect">Automationen und Skripte prüfen</button><div id="effects"></div></section><section id="history" hidden>
<div class="history-tools"><h2 id="historyTitle">Abgeschlossene Einrichtungen</h2><input id="jobSearch" type="search" placeholder="Gerät suchen" aria-label="Abgeschlossene Einrichtungen durchsuchen"></div>
<div id="jobs" class="job-list"></div><button id="showMore" hidden>Mehr anzeigen</button>
</section></main>
<script>
const $=id=>document.getElementById(id), form=$('form'), fields=form.elements;
let state, inv, ap='', selected='', sourceRead='', loading=false;
function element(tag,text){const n=document.createElement(tag); n.textContent=text;return n}
function button(text,fn){const b=element('button',text);b.type='button';b.onclick=guard(fn);return b}
function guard(fn){return async e=>{e?.preventDefault();$('msg').textContent='';try{await fn()}catch(err){$('msg').textContent=err.message;window.scrollTo(0,0)}}}
async function api(key,body={}){const res=await fetch('api/'+key,{method:'POST',headers:{'Content-Type':'application/json','X-Onboarding':'1'},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw Error(data.error||res.statusText);return data}
function options(sel,rows){sel.replaceChildren(...rows.map(([val,name])=>new Option(name,val)))}
function source(){return inv.sources.find(s=>s.id===$('src').value)}
function mac(){return (ap?ap.split('-').pop():fields.expected.value).replace(/[:-]/g,'').toLowerCase()}
function preview(){ $('preview').textContent='Vollständiges Topic: '+fields.base.value+($('suffix').checked?'-'+(mac()||'MAC'):'') }
function defaults(){let p=state.profile;Object.assign(fields.ssid,{value:p.ssid});fields.user.value=p.mqtt_user;fields.broker.value=p.broker;fields.tls.value=p.tls;fields.initial_state.value='off';fields.area.value='';sourceRead='';$('templateSummary').replaceChildren();$('origin').textContent='WLAN, Broker und Zugang aus dem lokalen App-Profil. Zugangsdaten in der App-Konfiguration ändern.'}
async function openForm(ssid,clone){inv=await api('inventory');ap=ssid;form.reset();$('wizard').hidden=false;$('heading').textContent=ssid||'Plug im Zielnetz';$('manualFields').hidden=!!ssid;
options($('src'),[['','Ohne Vorlage'],...inv.sources.map(s=>[s.id,s.name+' · '+(s.model||'Shelly')])]);options(fields.area,[['','Kein Bereich'],...inv.areas.map(a=>[a.area_id,a.name])]);defaults();$('templateBox').hidden=true;
if(clone){if(!inv.sources.length)throw Error('Keine Shelly-Vorlagen in HA gefunden.');$('src').selectedIndex=1;sourceChange()}
preview();$('wizard').scrollIntoView()}
function sourceChange(){defaults();const s=source();$('templateBox').hidden=!s;$('srcIp').value=s?.ip||''}
$('src').onchange=sourceChange;
$('load').onclick=guard(async()=>{const s=source();const p=await api('template',{source:s.id,ip:$('srcIp').value});for(const k of ['ssid','broker','user','tls','initial_state','area'])fields[k].value=p[k]||'';
fields.base.value=(p.source_topic||'shellies').split('/').slice(0,-1).concat(['neuer-plug']).join('/');sourceRead=s.id;preview();$('origin').textContent='WLAN, MQTT und Einschaltverhalten aus '+s.name+' gelesen. Passwörter und CA kommen aus dem lokalen Profil.';
showTemplateSettings($('templateSummary'), [
    ['Am Ziel auf Kompatibilität prüfen', p.field_paths],
    ['Aus der Vorlage ausgelassen', p.skipped]
]);});
function showTemplateSettings(container, groups){
    container.replaceChildren();
    for(const [title, fields] of groups){
        if(!fields?.length)continue;
        const details=element('details','');
        details.append(element('summary', title+' ('+fields.length+')'));
        const list=element('ul','');
        for(const field of fields)list.append(element('li',field));
        details.append(list);
        container.append(details);
    }
}
$('suffix').onchange=preview;fields.base.oninput=fields.expected.oninput=preview;
form.onsubmit=guard(async()=>{if(source()&&sourceRead!==source().id)throw Error('Vorlage zuerst lesen.');const data=Object.fromEntries(new FormData(form));data.ap=ap;data.expected=mac();data.topic=data.base+($('suffix').checked?'-'+mac():'');data.source=$('src').value;data.source_ip=$('srcIp').value;await api('start',data);sessionStorage.setItem('started',data.expected);$('wizard').hidden=true;await refresh()});
async function finish(j){inv=await api('inventory');selected=j.mac;$('finish').hidden=false;$('finishTitle').textContent=j.plan.name+' in Automationen aufnehmen';options($('labels'), inv.labels.map(l=>[l.label_id,l.name]));const christmas=inv.labels.find(l=>l.name.toLowerCase()==='weihnachten');if(christmas)$('labels').value=christmas.label_id;
options($('old'),inv.sources.flatMap(s=>s.switches.filter(e=>e!==j.entity).map(e=>[e,s.name+' · '+e])));$('effects').replaceChildren();$('finish').scrollIntoView({block:'start'})}
$('closeFinish').onclick=()=>{$('finish').hidden=true;selected=''};
$('addLabel').onclick=guard(async()=>{if(!$('labels').value)throw Error('Zuerst ein Label in HA anlegen.');await api('label',{mac:selected,label:$('labels').value});$('effects').textContent='Label zugewiesen.'});
async function inspect(){
    const mac=selected, old=$('old').value;
    if(!old)throw Error('Referenzschalter auswählen.');
    const out=await api('effects',{mac,old});
    if(selected!==mac||$('old').value!==old)return;
    const box=$('effects');
    box.replaceChildren(element('p',out.refs.length+' Treffer für '+state.jobs[mac].plan.name+'.'));
    const applicable=out.refs.filter(ref=>ref.changes.length);
    const apply=async refs=>{
        const controls=[...box.querySelectorAll('button'),$('inspect'),$('old')];
        controls.forEach(control=>control.disabled=true);
        try{
            const apply_all=Object.fromEntries(refs.map(ref=>[ref.path,ref.digest]));
            const result=await api('effects',{mac,old,apply_all});
            await refresh();
            if(selected===mac&&$('old').value===old){
                await inspect();
                box.prepend(element('p',result.saved.length+' von '+refs.length+' Änderungen übernommen.'));
                for(const failure of result.failed){
                    box.prepend(element('p',failure.name+': '+failure.error));
                }
            }
        }finally{
            controls.forEach(control=>control.disabled=false);
        }
    };
    if(applicable.length){
        const all=button('Alle '+applicable.length+' Änderungen übernehmen',()=>apply(applicable));
        all.className='primary';
        box.append(all);
    }
    for(const ref of out.refs){
        const row=element('article',ref.name);
        if(ref.changes.length){
            const detail=element('details','');
            detail.className='effect-details';
            const count=ref.changes.length;
            detail.append(element('summary',count+' '+(count===1?'Schaltaktion':'Schaltaktionen')),
                element('p',ref.changes.join(', ')));
            row.append(detail);
            row.append(button('Diese Änderung übernehmen',()=>apply([ref])));
        }else{
            row.append(element('p','Bezug manuell prüfen.'));
        }
        box.append(row);
    }
    if(out.skipped.length){
        const details=element('details','');
        details.append(element('summary','Übersprungene Einträge ('+out.skipped.length+')'),element('p',out.skipped.join(', ')));
        box.append(details);
    }
}
$('old').onchange=()=>$('effects').replaceChildren();
$('inspect').onclick=guard(inspect);$('manual').onclick=guard(()=>openForm('',false));$('scan').onclick=guard(async()=>{await api('scan');await refresh()});
const HISTORY_PAGE_SIZE=8;
let visibleJobs=HISTORY_PAGE_SIZE, renderedJobs='';
const expandedJobs=new Set();
$('jobSearch').oninput=()=>{visibleJobs=HISTORY_PAGE_SIZE;renderHistory()};
$('showMore').onclick=()=>{visibleJobs+=HISTORY_PAGE_SIZE;renderHistory()};

function renderHistory(){
    const finished=Object.values(state.jobs).reverse().filter(job=>job.step==='Fertig');
    const query=$('jobSearch').value.trim().toLowerCase();
    const matches=finished.filter(job=>[job.plan.name,job.ip,job.entity].some(value=>value?.toLowerCase().includes(query)));
    const signature=JSON.stringify([finished.length,matches.slice(0,visibleJobs),matches.length,state.backups,query]);
    if(signature===renderedJobs)return;
    renderedJobs=signature;
    $('history').hidden=!finished.length;
    $('historyTitle').textContent='Abgeschlossene Einrichtungen ('+finished.length+')';
    const rows=[];
    const backupsByDevice=new Map();
    for(const key of state.backups){
        const [mac,entity]=key.split(':');
        if(!backupsByDevice.has(mac))backupsByDevice.set(mac,[]);
        backupsByDevice.get(mac).push([key,entity]);
    }
    for(const job of matches.slice(0,visibleJobs)){
        const row=element('details','');
        row.className='job-row';
        row.open=expandedJobs.has(job.mac);
        row.ontoggle=()=>row.open?expandedJobs.add(job.mac):expandedJobs.delete(job.mac);
        const summary=element('summary','');
        summary.append(element('strong',job.plan.name));
        if(job.template_warnings?.length){
            const warning=element('small',' · '+job.template_warnings.length+' Hinweise');
            warning.className='warning';
            summary.append(warning);
        }
        const body=element('div','');
        body.className='job-body';
        const meta=element('span',[job.ip,job.entity].filter(Boolean).join(' · '));
        meta.className='job-meta';
        const report=element('div','');
        showTemplateSettings(report,[
            ['Am Ziel bestätigt',job.template_confirmed],
            ['Bitte prüfen',job.template_warnings],
            ['Aus der Vorlage ausgelassen',job.template_skipped]
        ]);
        body.append(meta,report,button('Label und Automationen …',()=>finish(job)));
        const backups=backupsByDevice.get(job.mac);
        if(backups?.length){
            const undo=element('details',''), list=element('ul','');
            list.className='undo-list';
            for(const [key,entity] of backups.reverse()){
                const item=element('li','');
                item.append(element('code',entity),button('Zurücknehmen',async()=>{
                    if(!confirm('Änderung an '+entity+' für '+job.plan.name+' zurücknehmen?'))return;
                    await api('undo',{key});await refresh();
                }));
                list.append(item);
            }
            undo.append(element('summary','Änderungen zurücknehmen ('+backups.length+')'),list);
            body.append(undo);
        }
        row.append(summary,body);
        rows.push(row);
    }
    if(!rows.length&&finished.length)rows.push(element('p','Keine passenden Geräte gefunden.'));
    $('jobs').replaceChildren(...rows);
    const remaining=matches.length-visibleJobs;
    $('showMore').hidden=remaining<=0;
    $('showMore').textContent='Mehr anzeigen ('+Math.max(0,remaining)+')';
}

function renderActive(){
    const active=Object.values(state.jobs).reverse().filter(job=>job.step!=='Fertig');
    const container=$('active');
    container.replaceChildren();
    if(!active.length)return;
    container.append(element('h2','Offene Einrichtungen'));
    for(const job of active){
        const row=element('article','');
        row.append(element('strong',job.plan.name),element('p',[job.step,job.ip,job.progress].filter(Boolean).join(' · ')));
        if(job.error){
            const error=element('p',job.error);
            error.className='warning';
            row.append(error);
        }
        if(!state.busy)row.append(button('Fortsetzen',async()=>{
            const ip=prompt('Optional neue Ziel-IP eingeben. Leer = gespeicherten Schritt wiederholen.',job.ip||'');
            if(ip!==null){await api('resume',{mac:job.mac,ip});await refresh()}
        }),button('Vorgang verwerfen',async()=>{
            if(confirm('Lokalen Vorgang verwerfen? Bereits geschriebene Geräteeinstellungen bleiben aktiv.')){
                await api('discard',{mac:job.mac});await refresh();
            }
        }));
        container.append(row);
    }
}

async function refresh(){
    if(loading)return;
    loading=true;
    try{
        state=await api('state');
        $('notice').textContent=state.notice;
        $('aps').replaceChildren();
        for(const ssid of state.aps){
            const row=element('article','');
            row.append(element('strong',ssid),element('br',''),button('Neu einrichten',()=>openForm(ssid,false)),
                button('Nach Vorlage',()=>openForm(ssid,true)),button('Ignorieren',async()=>{await api('ignore',{ap:ssid});await refresh()}));
            $('aps').append(row);
        }
        if(!state.aps.length)$('aps').textContent='Aktuell kein neuer Shelly in Funkreichweite.';
        $('ignored').replaceChildren(...state.ignored.map(ap=>button(ap+' wieder anzeigen',async()=>{await api('ignore',{ap});await refresh()})));
        renderActive();
        renderHistory();
        const completed=state.jobs[sessionStorage.getItem('started')];
        if(completed?.step==='Fertig'){
            await finish(completed);
            sessionStorage.removeItem('started');
        }
    }finally{loading=false}
}
guard(refresh)();setInterval(()=>refresh().catch(error=>{$('msg').textContent=error.message}),5000);
</script></html>
